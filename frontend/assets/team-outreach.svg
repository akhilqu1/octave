  <circle cx="80" cy="64" r="26" fill="url(#out-skin)"/>
  <!-- Hair curls -->
  <circle cx="56" cy="52" r="10" fill="#1e293b"/>
  <circle cx="104" cy="52" r="10" fill="#1e293b"/>
  <circle cx="68" cy="40" r="11" fill="#1e293b"/>
  <circle cx="92" cy="40" r="11" fill="#1e293b"/>
  <circle cx="80" cy="38" r="12" fill="#1e293b"/>
  <!-- Body / Denim or Jacket -->
  <path d="M38 140 C42 108, 60 98, 80 98 C100 98, 118 108, 122 140 Z" fill="url(#out-accent)"/>
  <!-- Inner shirt -->
  <circle cx="80" cy="112" r="10" fill="#ffffff" opacity="0.9"/>
  <!-- Community / Heart / Chat Emblem -->
  <circle cx="126" cy="126" r="18" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <path d="M126 120 C123 117, 118 119, 118 123 C118 128, 126 133, 126 133 C126 133, 134 128, 134 123 C134 119, 129 117, 126 120 Z" fill="#60a5fa"/>
