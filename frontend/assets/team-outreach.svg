  </defs>
  <rect width="160" height="160" rx="32" fill="url(#out-bg)"/>
  <!-- Radiating Community Waves in Background -->
  <path d="M26 120 A60 60 0 0 1 134 120" stroke="rgba(37, 99, 235, 0.3)" stroke-width="3" fill="none"/>
  <path d="M40 120 A44 44 0 0 1 120 120" stroke="rgba(37, 99, 235, 0.2)" stroke-width="2" fill="none"/>
